title: Bongo
description: "Bongo is a mail and calendar server. It runs as one Go binary and serves IMAP, SMTP, POP3, CalDAV, CardDAV and a web interface."
url: "https://bongo-project.org"
baseurl: ""

# Current release, shown on the home page. Update at each release
# (scripts/sync_releases.py refreshes the releases page itself).
latest_release: v0.15.9
repository_url: https://github.com/bongo-project/bongo

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - Makefile
  - scripts
  - vendor
  - params.json
  - .project
